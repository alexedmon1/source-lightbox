[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "source-lightbox"
version = "0.1.0"
description = "Static gallery builder for EEG source analysis results"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pillow>=10.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
source-lightbox = "source_lightbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
source_lightbox = ["templates/*.j2", "static/**/*"]
