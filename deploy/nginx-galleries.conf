# nginx site for hosting source-lightbox galleries on a LAN workstation.
#
# Install:
#   sudo cp nginx-galleries.conf /etc/nginx/sites-available/forge-galleries
#   sudo ln -s /etc/nginx/sites-available/forge-galleries /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # drop the stock default site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Galleries are fully static (manifest inlined, all paths relative), so they host
# cleanly under a sub-path via `alias`. Edit the alias paths to match where the
# drive is mounted. Add a `location /msN/ { ... }` block per gallery.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # responds on the workstation's IP/hostname

    # Landing page that links to each gallery (see deploy/landing.html).
    root /srv/forge-galleries;
    index index.html;
    autoindex off;

    # ---- MS2: treatment study (built from study_treatment.yaml -> gallery_treatment/)
    location = /ms2 { return 301 /ms2/; }
    location /ms2/ {
        alias /mnt/forge/FORGE/gallery_treatment/;
        index index.html;
    }

    # ---- MS1: KO vs WT (built from study.yaml -> gallery/)
    location = /ms1 { return 301 /ms1/; }
    location /ms1/ {
        alias /mnt/forge/FORGE/gallery/;
        index index.html;
    }

    # Optional LAN password (uncomment + create the file):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd labuser
    # auth_basic           "FORGE galleries";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
