# Apache 2.4 site for hosting source-lightbox galleries on a LAN workstation.
#
# Install:
#   sudo cp apache-galleries.conf /etc/apache2/sites-available/forge-galleries.conf
#   sudo a2ensite forge-galleries
#   sudo a2dissite 000-default                       # drop the stock default site
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Galleries are fully static (manifest inlined, all paths relative), so they host
# cleanly under a sub-path via Alias. Edit the Alias paths to match where the
# drive is mounted. Add an Alias + <Directory> pair per gallery. mod_alias and
# mod_dir are enabled by default, so the /msN -> /msN/ redirect needs no config.

<VirtualHost *:80>
    ServerName _                        # responds on the workstation's IP/hostname

    # Landing page that links to each gallery (see deploy/landing.html).
    DocumentRoot /srv/forge-galleries
    DirectoryIndex index.html

    <Directory /srv/forge-galleries>
        Require all granted
        Options -Indexes
    </Directory>

    # ---- MS2: treatment study (built from study_treatment.yaml -> gallery_treatment/)
    Alias /ms2 /mnt/forge/FORGE/gallery_treatment
    <Directory /mnt/forge/FORGE/gallery_treatment>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    # ---- MS1: KO vs WT (built from study.yaml -> gallery/)
    Alias /ms1 /mnt/forge/FORGE/gallery
    <Directory /mnt/forge/FORGE/gallery>
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    # Optional LAN password (uncomment + create the file):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/apache2/.htpasswd labuser
    # <Location />
    #     AuthType Basic
    #     AuthName "FORGE galleries"
    #     AuthUserFile /etc/apache2/.htpasswd
    #     Require valid-user
    # </Location>
</VirtualHost>
